<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cl_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cl_no" data-rule="required" class="form-control" name="row[cl_no]" type="text" value="{$row.cl_no|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cl_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cl_name" data-rule="required" class="form-control" name="row[cl_name]" type="text" value="{$row.cl_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Cl_note')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-cl_note" class="form-control" name="row[cl_note]" type="text" value="{$row.cl_note|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('D_no')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-d_no" data-rule="required" class="form-control" name="row[d_no]" type="text" value="{$row.d_no|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
